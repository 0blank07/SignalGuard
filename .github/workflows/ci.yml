name: SignalGuard CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Evaluation Verification (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: signalguard
          POSTGRES_PASSWORD: signalguard_test_password
          POSTGRES_DB: signalguard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff static analysis & linting
        run: |
          ruff check backend evaluation tests

      - name: Run Test Suite with Coverage
        env:
          DATABASE_URL: sqlite:///:memory:
          ENVIRONMENT: test
        run: |
          pytest -v --cov=backend/app --cov-report=term-missing

      - name: Verify AI Code Evaluation Laboratory Benchmarks
        run: |
          python -m evaluation.cli verify-all
